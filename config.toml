# BioMoQA RAG Configuration

[server]
host = "0.0.0.0"
port = 9000
workers = 1  # Keep at 1 for GPU mode
log_level = "info"

[generation]
# "remote": the shared language-model server ([llm] below); no model is loaded here.
# "vllm":   the [model] below, loaded in this process on the GPU.
# "cpu":    a small model on the CPU (model.size).
backend = "remote"
max_tokens = 300
temperature = 0.2  # raised from 0.1 — greedy sampling causes degenerate repetition loops

[llm]
# The shared language-model server (OpenAI-compatible, LAN only, no key).
base_url = "http://llm.lan.text-analytics.ch/qwen/v1"
model = "Qwen3.8-27B"
# No first token in this many seconds: the extractive answer is sent, with a note.
first_token_timeout = 4.0
total_timeout = 20.0
priority = -10  # interactive; batch jobs on the same server send a positive value
# Batch jobs, recognised automatically: a POST that does not come from a web browser (a script,
# such as the trait pipeline). Served after people, allowed to wait, and an error rather than
# BioBERT's answer when the model still does not answer.
batch_priority = 10
batch_first_token_timeout = 60.0
batch_total_timeout = 100.0

[depth]
# Requests choose with `depth` ("fast" or "deep"); this is the default.
default = "fast"
candidates_per_search = 20
subquery_timeout = 3.0       # deep: no reply from the model in this time, the fast search is used
extra_search_timeout = 1.0   # deep: a model-written search slower than this counts as empty
min_agreement = 0.8          # deep: keep a model-written search whose first five match the question this well
max_new_words = 5            # deep: words a model-written search may add to the question's
guess_query = true           # deep: search the model's guess when it is sure of it
guess_margin = 1.0           # deep: reranker logit a guess-only document needs above the fifth
batch_subquery_timeout = 30.0  # deep, batch jobs: how long the model may take to write its searches

[model]
# Used only with generation.backend = "vllm" or "cpu".
# Inference mode: "gpu", "gpu_small", or "cpu"
mode = "gpu"

# Pre-quantized FP8 model — required on A100 (compute cap 8.0).
# Dynamic fp8 on base Qwen3-8B is broken on A100 with vLLM 0.19.0 (garbage output).
# Pre-quantized weights use W8A16 Marlin path on A100 correctly. Same ~8GB footprint.
model_name = "Qwen/Qwen3-8B-FP8"

# Model size for CPU mode: "0.5b", "1.5b", "3b", "7b"
size = "8b"

# GPU settings
gpu_memory_utilization = 0.83
quantization = "fp8"  # or null to disable

[sibils]
# SIBILS search API endpoint
search_api_url = "https://biodiversitypmc.sibils.org/api/search"

# SIBILS query parser API endpoint
query_parser_api_url = "https://biodiversitypmc.dev.sibils.org/api/query/parse"

# Default collections to search (comma-separated): medline, plazi, pmc, suppdata
collections = ["medline", "plazi", "pmc"]

# HTTP User-Agent header for API requests
user_agent = "BioMoQA-RAG/1.0 (https://github.com/sibils/BioMoQA-RAG)"

# Disk cache for SIBILS responses (avoids repeated API calls for identical queries)
cache_dir = "data/sibils_cache"
cache_ttl = 604800  # 7 days in seconds

[reranking]
# Every candidate is scored against the question as asked; the best final_n are read.
model = "cross-encoder/ms-marco-MiniLM-L-12-v2"
device = "cpu"

[extraction]
# BioBERT device: 0 = GPU, -1 = CPU. GPU cuts inference from ~0.8s to ~0.05s.
device = -1

# BioBERT extractive QA model
model = "ktrapeznikov/biobert_v1.1_pubmed_squad_v2"

[relevance_filter]
final_n = 5                  # documents the reader gets
min_extractive_score = 0.20  # POST /batch drops extractive answers below this

[context]
max_abstract_length = 1500  # used by BioBERT extractive QA
llm_abstract_length = 600   # window the language model gets from a long document
llm_whole_upto = 2500       # documents up to this length are given whole
truncate_abstracts = true
